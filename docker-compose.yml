services:
  server:
    build: ./server
    ports:
      - "3000:3000"
    volumes:
      - /app/node_modules
      - ./server:/app
    environment:
      - PORT=3000
      - CI=true
    command: sh -c "pnpm install && pnpm dev"

  client:
    build: ./client
    ports:
      - "5173:5173"
    environment:
      - CI=true
    volumes:
      - /app/node_modules
      - ./client:/app
    command: sh -c "pnpm install && pnpm dev --host"