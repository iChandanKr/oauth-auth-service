services:
  server:
    build: ./apps/server
    ports:
      - "3000:3000"
    volumes:
      - /app/node_modules
      - ./apps/server:/app
    environment:
      - PORT=3000
      - CI=true
    command: sh -c "pnpm install --no-frozen-lockfile && pnpm dev"
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ./apps/server/.env

  postgres:
    image: postgres:15-alpine
    ports:
      - "5435:5432"
    env_file:
      - ./apps/server/.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  client:
    build: ./apps/client
    ports:
      - "5173:5173"
    environment:
      - CI=true
    volumes:
      - /app/node_modules
      - ./apps/client:/app
    command: sh -c "pnpm install && pnpm dev --host"

volumes:
  postgres_data: